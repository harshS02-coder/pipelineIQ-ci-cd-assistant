<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>PipelineIQ — CI/CD Failure Intelligence CLI</title>
  <link rel="stylesheet" href="/css/style.css?v=4.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFFFFF'><rect x='2' y='4' width='20' height='16' rx='0' fill='none' stroke='%23FFFFFF' stroke-width='2'/><polyline points='6 9 10 12 6 15' stroke='%23FFFFFF' stroke-width='2' fill='none'/><line x1='12' y1='15' x2='17' y2='15' stroke='%23FFFFFF' stroke-width='2'/></svg>" />
</head>
<body class="unauthenticated">
  <div id="app">
    <!-- Terminal Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <a href="#/dashboard" class="brand">
        <span style="color:#737373;">$</span>
        <span style="font-weight:700;">pipelineiq</span>
      </a>

      <nav class="nav-menu">
        <div class="nav-section-title">COMMANDS</div>
        
        <a href="#/dashboard" class="nav-item active">
          <span style="font-weight:700;">></span>
          <span>overview</span>
        </a>

        <a href="#/add-repo" class="nav-item">
          <span style="font-weight:700;">></span>
          <span>add-repo</span>
        </a>

        <a href="#/monitoring" class="nav-item">
          <span style="font-weight:700;">></span>
          <span>monitoring</span>
        </a>

        <a href="#/settings" class="nav-item">
          <span style="font-weight:700;">></span>
          <span>settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="system-status-pill" id="health-indicator">
          <span class="status-dot"></span>
          <span>ENGINE: ONLINE</span>
        </div>
      </div>
    </aside>

    <!-- Main Terminal Wrapper -->
    <div class="main-wrapper">
      <!-- Terminal Top Bar -->
      <header class="top-nav">
        <!-- Landing Brand (Visible on unauthenticated Landing) -->
        <a href="#/" class="landing-brand">
          <span style="color:#737373;">$</span>
          <span style="font-weight:700;">pipelineiq</span>
          <span class="badge" style="margin-left:6px; font-size:9px;">CLI/CI</span>
        </a>

        <!-- Search Box (Visible on Dashboard) -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="search" 
            id="search-input" 
            class="search-input" 
            placeholder="grep repos, branches, SHAs..." 
          />
        </div>

        <!-- Right Corner Actions -->
        <div class="top-nav-actions" id="user-section">
          <!-- Populated by app.js -->
        </div>
      </header>

      <!-- Dynamic Content Area -->
      <main class="content-body" id="content-area">
        <!-- Rendered by client-side router -->
      </main>

      <!-- Terminal Global Footer -->
      <footer class="terminal-footer">
        <div>PipelineIQ — built with Claude, Node.js, MongoDB, Groq</div>
        <div class="footer-status">
          <span class="status-dot"></span>
          <span>SYSTEM: READY • v1.0.0</span>
        </div>
      </footer>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="/js/app.js?v=4.0"></script>
</body>
</html>

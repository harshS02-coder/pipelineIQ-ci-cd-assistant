# ==============================================================================
# PipelineIQ — Render Infrastructure Blueprint (render.yaml)
# ==============================================================================

services:
  # 1. PipelineIQ Full-Stack Web Service (Express API + Monospace CLI UI)
  - type: web
    name: pipelineiq-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: pipelineiq-redis
          property: connectionString

  # 2. Managed Redis Instance (For BullMQ queues)
  - type: redis
    name: pipelineiq-redis
    region: oregon
    plan: free
    ipAllowList: []
